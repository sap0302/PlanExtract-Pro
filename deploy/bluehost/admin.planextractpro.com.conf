# Bluehost — admin.planextractpro.com
#
# Point the subdomain's A record at the same server as planextractpro.com.
# This vhost proxies to the admin Next.js process on port 3100.

<VirtualHost *:80>
  ServerName admin.planextractpro.com
  Redirect permanent / https://admin.planextractpro.com/
</VirtualHost>

<VirtualHost *:443>
  ServerName admin.planextractpro.com

  SSLEngine on
  SSLCertificateFile /etc/ssl/certs/admin.planextractpro.com.crt
  SSLCertificateKeyFile /etc/ssl/private/admin.planextractpro.com.key

  RequestHeader set X-Forwarded-Proto "https"
  RequestHeader set X-Forwarded-Host "admin.planextractpro.com"

  ProxyPreserveHost On
  ProxyPass / http://127.0.0.1:3100/
  ProxyPassReverse / http://127.0.0.1:3100/
</VirtualHost>
