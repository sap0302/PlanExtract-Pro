# Bluehost — planextractpro.com + admin.planextractpro.com
#
# These apps are Next.js Node servers, not PHP. They will not run on a
# basic shared-hosting document root. Use a VPS / Cloud / Dedicated plan
# (Apache reverse proxy below) or cPanel "Setup Node.js App" (Passenger).
# Node 20 LTS is required because of native addons (better-sqlite3, sharp, canvas).

<VirtualHost *:80>
  ServerName planextractpro.com
  ServerAlias www.planextractpro.com
  Redirect permanent / https://planextractpro.com/
</VirtualHost>

<VirtualHost *:443>
  ServerName planextractpro.com
  ServerAlias www.planextractpro.com

  SSLEngine on
  SSLCertificateFile /etc/ssl/certs/planextractpro.com.crt
  SSLCertificateKeyFile /etc/ssl/private/planextractpro.com.key
  # AutoSSL / Let's Encrypt paths differ on cPanel — use the ones it generated.

  RequestHeader set X-Forwarded-Proto "https"
  RequestHeader set X-Forwarded-Host "planextractpro.com"

  ProxyPreserveHost On
  ProxyPass / http://127.0.0.1:3000/
  ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>
